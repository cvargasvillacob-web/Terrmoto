<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{TITULO}} · Proyectos Pacífica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4f5f3; --surface: #ffffff; --ink: #14212b; --ink-2: #46535e; --muted: #6c7883; --line: #d9dfe2;
  --sea: #203e98; --sea-2: #2c56c8; --chip: #e8edf0;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f1418; --surface: #182026; --ink: #edf1f3; --ink-2: #b8c3cb; --muted: #8b98a3; --line: #29333a;
  --sea: #3460d0; --sea-2: #7d9cf0; --chip: #232c32; color-scheme: dark } }
* { box-sizing: border-box; }
html { cursor: url("../marca/pacifica-cursor.png") 25 47, auto; cursor: -webkit-image-set(url("../marca/pacifica-cursor.png") 1x, url("../marca/pacifica-cursor@2x.png") 2x) 25 47, auto; }
a { cursor: url("../marca/pacifica-cursor.png") 25 47, pointer; cursor: -webkit-image-set(url("../marca/pacifica-cursor.png") 1x, url("../marca/pacifica-cursor@2x.png") 2x) 25 47, pointer; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--f-body); }
a { color: var(--sea-2); }
.barra { border-bottom: 1px solid var(--line); background: var(--surface); }
.barra .in { max-width: 980px; margin: 0 auto; padding: 12px max(20px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px)); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 600 14px var(--f-display); }
.barra a { text-decoration: none; }
main { max-width: 860px; margin: 0 auto; padding: 32px max(20px, env(safe-area-inset-right, 0px)) 64px max(20px, env(safe-area-inset-left, 0px)); }
h1 { font: 800 clamp(28px, 4vw, 40px)/1.1 var(--f-display); letter-spacing: -.01em; margin: 0 0 18px; text-wrap: balance; }
h2 { font: 800 24px/1.2 var(--f-display); margin: 40px 0 12px; text-wrap: balance; }
h3 { font: 700 18px/1.3 var(--f-display); margin: 28px 0 8px; }
p, li { color: var(--ink-2); overflow-wrap: break-word; }
main a { overflow-wrap: anywhere; }
blockquote { margin: 18px 0; padding: 12px 16px; background: var(--chip); border-radius: 8px; color: var(--ink-2); }
blockquote p { margin: 0; }
.tabla { overflow-x: auto; margin: 16px 0 22px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 13px var(--f-display); color: var(--muted); }
code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
pre.reporte { white-space: pre-wrap; word-break: break-word; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; font: 15px/1.6 var(--f-body); color: var(--ink); }
.pie { margin-top: 40px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="barra"><div class="in"><a href="./">← Proyectos Pacífica</a><span>{{TITULO}}</span></div></div>
<!-- Las tablas anchas se desplazan dentro de su caja en el celular -->

<main>
{{CUERPO}}
<p class="pie">Actualizado el {{FECHA}}. Documento interno de trabajo: no lo reenvíe fuera del equipo del proyecto.</p>
</main>
</body>
</html>
