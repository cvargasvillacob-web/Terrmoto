<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Proyectos Pacífica</title>
<link rel="icon" href="marca/pacifica-marca.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Portal privado: franja de marca arriba y, por proyecto, el mapa destacado y sus documentos. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --ink: #121a33; --ink-2: #454e66; --muted: #6b7388; --line: #dadfe8;
  --azul: #203e98; --azul-osc: #122766; --azul-claro: #3460d0; --acento: #2c56c8; --chip: #e9edf6;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0d1222; --surface: #161d33; --ink: #edf0f7; --ink-2: #b9c1d6; --muted: #8790a8; --line: #273050;
  --acento: #7d9cf0; --chip: #1f2843; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); }
a { color: var(--acento); }
a:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; border-radius: 6px; }
/* Puntero del mouse: el pin de Pacífica (la punta marca el clic); en campos de texto queda el normal */
html { cursor: url("marca/pacifica-cursor.png") 25 47, auto; cursor: -webkit-image-set(url("marca/pacifica-cursor.png") 1x, url("marca/pacifica-cursor@2x.png") 2x) 25 47, auto; }
a, button { cursor: url("marca/pacifica-cursor.png") 25 47, pointer; cursor: -webkit-image-set(url("marca/pacifica-cursor.png") 1x, url("marca/pacifica-cursor@2x.png") 2x) 25 47, pointer; }
.cab { background: var(--surface); border-bottom: 1px solid var(--line); }
.cab .in, main { max-width: 1040px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.cab .in { display: flex; align-items: center; gap: 16px; padding-block: 14px; }
.cab img { display: block; width: 96px; height: auto; border-radius: 3px; }
.cab .txt { display: flex; flex-direction: column; border-left: 1px solid var(--line); padding-left: 16px; }
.cab .txt b { font: 800 21px/1.1 var(--f-display); }
.cab .txt span { color: var(--muted); font-size: 13px; }
.cab .anos { margin-left: auto; font: 600 11px var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
@media (max-width: 480px) { .cab .anos { display: none; } }
main { padding-block: 28px 56px; }
.proyecto { margin-bottom: 40px; }
.proyecto h1 { font: 800 clamp(24px, 3.6vw, 34px)/1.12 var(--f-display); margin: 0 0 6px; letter-spacing: -.01em; text-wrap: balance; }
.proyecto .meta { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.mapa { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; margin-bottom: 16px; }
@media (max-width: 700px) { .mapa { grid-template-columns: minmax(0, 1fr); } }
.mapa .vista { min-height: 180px; background: var(--azul) radial-gradient(90% 120% at 35% 30%, var(--azul-claro), var(--azul) 55%, var(--azul-osc)); position: relative; }
.mapa .vista svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapa .txt { padding: 22px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.mapa h2 { font: 800 22px/1.15 var(--f-display); margin: 0; }
.mapa p { margin: 0; color: var(--ink-2); }
.boton { align-self: flex-start; margin-top: 6px; background: var(--azul); color: #fff; font: 700 15px var(--f-display); padding: 10px 16px; border-radius: 8px; }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 4px; }
.doc:hover, .mapa:hover { border-color: var(--acento); }
.doc b { font: 700 17px var(--f-display); }
.doc span { color: var(--ink-2); font-size: 14px; }
.cifras { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.cifras i { font-style: normal; font: 600 12px var(--f-display); background: var(--chip); padding: 3px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
footer { color: var(--muted); font-size: 13px; max-width: 1040px; margin: 0 auto; padding: 0 18px 32px; }
</style>
</head>
<body>
<header class="cab"><div class="in">
  <img src="marca/logo-pacifica-web.jpg" srcset="marca/logo-pacifica-web@2x.jpg 2x" alt="Pacífica Inmobiliaria" width="400" height="323">
  <div class="txt"><b>Proyectos</b><span>Acceso privado</span></div>
  <span class="anos">20 años · Panamá</span>
</div></header>
<main>
{{PROYECTOS}}
</main>
<footer>Actualizado el {{FECHA}}. Información confidencial de trabajo: no la reenvíe fuera del equipo del proyecto.</footer>
</body>
</html>
